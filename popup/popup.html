<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pump.fun Terminal</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="terminal-container">
    <div class="header">
      <div class="logo">⚡ Pump.fun Pro Terminal</div>
      <span class="badge">v1.0.0</span>
    </div>

    <div class="section">
      <label for="rpcUrl">Custom Solana RPC</label>
      <input type="text" id="rpcUrl" placeholder="https://mainnet.helius-rpc.com/?api-key=...">
    </div>

    <div class="row">
      <div class="col">
        <label for="slippage">Slippage (%)</label>
        <input type="number" id="slippage" value="5" min="1" max="50">
      </div>
      <div class="col">
        <label for="priorityFee">Priority Tip (SOL)</label>
        <input type="number" id="priorityFee" value="0.005" step="0.001">
      </div>
    </div>

    <div class="section">
      <label>Quick Buy Presets (SOL)</label>
      <div class="presets-row">
        <input type="number" id="preset1" value="0.2" step="0.1">
        <input type="number" id="preset2" value="0.5" step="0.1">
        <input type="number" id="preset3" value="1.0" step="0.5">
      </div>
    </div>

    <div class="section toggle-section">
      <label class="switch-label">
        <input type="checkbox" id="devAlertToggle" checked>
        <span class="slider"></span>
        Dev Wallet Dumping Alerts
      </label>
    </div>

    <button id="saveBtn" class="btn-primary">Save Settings</button>
    <div id="status" class="status-msg"></div>

    <div class="footer">
      Built by <a href="https://github.com/jahanzaib-codes" target="_blank">jahanzaib-codes</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
